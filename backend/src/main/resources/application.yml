spring:
  application:
    name: library-management-backend

  servlet:
    multipart:
      max-file-size: 5MB
      # Incident upload: 5 images x 5 MB plus multipart headers. Book covers still enforce 3 MB in the service.
      max-request-size: 26MB

  devtools:
    restart:
      enabled: false

  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:library_management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  auth:
    jwt-secret-base64: ${JWT_SECRET_BASE64:}
    access-token-minutes: 30
    refresh-token-days: 7
    max-failed-attempts: 5
    lock-minutes: 15

  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@libra.edu.vn}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:Quản trị hệ thống}

  frontend-url: ${FRONTEND_URL:http://localhost:5173}

  permission-review:
    runner: ${PERMISSION_REVIEW_RUNNER:local}
    github:
      owner: ${PERMISSION_REVIEW_GITHUB_OWNER:}
      repository: ${PERMISSION_REVIEW_GITHUB_REPO:}
      token: ${PERMISSION_REVIEW_GITHUB_TOKEN:}
      callback-secret: ${PERMISSION_REVIEW_CALLBACK_SECRET:}

  pickup-email:
    automatic-enabled: ${PICKUP_EMAIL_AUTOMATIC_ENABLED:true}
    location: ${PICKUP_LOCATION:}
    last-day-send-time: ${PICKUP_LAST_DAY_SEND_TIME:07:00}

  mail:
    from: ${MAIL_FROM:noreply@libra.edu.vn}
    max-attempts: ${MAIL_MAX_ATTEMPTS:3}
    retry-delay-ms: ${MAIL_RETRY_DELAY_MS:1500}

spring.mail:
  host: ${MAIL_HOST:smtp.gmail.com}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties:
    mail.smtp.auth: true
    mail.smtp.starttls.enable: true
    mail.smtp.connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:5000}
    mail.smtp.timeout: ${MAIL_READ_TIMEOUT_MS:10000}
    mail.smtp.writetimeout: ${MAIL_WRITE_TIMEOUT_MS:10000}
