spring:
  application:
    name: library-management-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:library_management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  auth:
    jwt-secret-base64: ${JWT_SECRET_BASE64:}
    access-token-minutes: 30
    refresh-token-days: 7
    max-failed-attempts: 5
    lock-minutes: 15

  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@libra.edu.vn}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:Quản trị hệ thống}
