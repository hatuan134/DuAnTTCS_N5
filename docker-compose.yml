services:
  postgres:
    image: postgres:15
    container_name: duanttcs_n5_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-library_management}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - library_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-library_management}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  library_postgres_data:
