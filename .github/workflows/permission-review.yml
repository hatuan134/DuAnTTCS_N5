name: LIBRA S4-09 - Kiem thu phan quyen

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 19 * * *' # 02:00 Asia/Ho_Chi_Minh, following calendar day
  workflow_dispatch:
    inputs:
      run_key:
        description: 'UUID cua yeu cau tren LIBRA'
        required: false
        type: string
      fingerprint:
        description: 'SHA256 ma tran quyen cua backend dang chay'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: libra-permission-review
  cancel-in-progress: false

jobs:
  review:
    if: github.ref == 'refs/heads/main'
    name: PostgreSQL cach ly + 4 vai tro + bao cao
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: libra_review
          POSTGRES_PASSWORD: libra_review_temporary_only
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U libra_review -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      RUN_KEY: ${{ inputs.run_key }}
      EXPECTED_FINGERPRINT: ${{ inputs.fingerprint }}
      DB_HOST: 127.0.0.1
      DB_PORT: '5433'
      DB_USERNAME: libra_review
      DB_PASSWORD: libra_review_temporary_only
      PERMISSION_REVIEW_LIVE_DB: library_management
      S4_09_2_DB_TEST: 'true'
      BOOTSTRAP_ADMIN_PASSWORD: ''
      MAIL_USERNAME: ''
      MAIL_PASSWORD: ''
      MAIL_HOST: 127.0.0.1
      PICKUP_EMAIL_AUTOMATIC_ENABLED: 'false'
      APP_SCHEDULING_ENABLED: 'false'

    steps:
      - name: Xac thuc dinh dang yeu cau
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RUN_KEY" ]]; then RUN_KEY=$(cat /proc/sys/kernel/random/uuid); fi
          [[ "$RUN_KEY" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          [[ -z "$EXPECTED_FINGERPRINT" || "$EXPECTED_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
          echo "RUN_KEY=$RUN_KEY" >> "$GITHUB_ENV"
          echo "REVIEW_STARTED_AT=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"
          DB_NAME="s4092_review_${RUN_KEY//-/}"
          echo "DB_NAME=$DB_NAME" >> "$GITHUB_ENV"
          echo "PERMISSION_REVIEW_RUN_KEY=$RUN_KEY" >> "$GITHUB_ENV"
          echo "PERMISSION_REVIEW_RESULT=$RUNNER_TEMP/s4092-result.json" >> "$GITHUB_ENV"

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Cai JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Tao database thu nghiem, tuyet doi khong dung Production
        id: database
        shell: bash
        run: |
          set -euo pipefail
          export PGHOST="$DB_HOST" PGPORT="$DB_PORT" PGUSER="$DB_USERNAME" PGPASSWORD="$DB_PASSWORD"
          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE $DB_NAME TEMPLATE template0;"

      - name: Chay tat ca API voi 4 vai tro va anonymous
        id: tests
        working-directory: backend
        shell: bash
        run: |
          set +e
          mvn -B -ntp -Dtest=FullPermissionDatabaseTest test
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Tao callback ky HMAC SHA-256 va gui ket qua ve LIBRA
        if: ${{ always() && steps.validate.outcome == 'success' }}
        shell: bash
        env:
          CALLBACK_SECRET: ${{ secrets.LIBRA_REVIEW_CALLBACK_SECRET }}
          CALLBACK_URL: ${{ secrets.LIBRA_REVIEW_CALLBACK_URL }}
          TEST_EXIT: ${{ steps.tests.outputs.exit_code }}
        run: |
          set -euo pipefail
          test -n "$CALLBACK_SECRET"
          test -n "$CALLBACK_URL"
          [[ "$CALLBACK_URL" == https://* ]]
          node scripts/qa/permission-review-callback.mjs
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 4 \
            --connect-timeout 10 --max-time 60 \
            -H 'Content-Type: application/json' \
            -H "$(sed -n '1p' "$RUNNER_TEMP/callback.headers")" \
            -H "$(sed -n '2p' "$RUNNER_TEMP/callback.headers")" \
            --data-binary @"$RUNNER_TEMP/callback.json" "$CALLBACK_URL"

      - name: Luu file ket qua de doi soat khi callback bi loi
        if: ${{ always() && steps.validate.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: s4092-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/s4092-result.json
            ${{ runner.temp }}/callback.json
            backend/target/surefire-reports/*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Danh dau workflow that bai neu bo test chua dat
        if: ${{ always() }}
        shell: bash
        env:
          TEST_EXIT: ${{ steps.tests.outputs.exit_code }}
        run: |
          if [[ "$TEST_EXIT" != 0 || ! -f "$RUNNER_TEMP/review-passed" || "$(cat "$RUNNER_TEMP/review-passed")" != true ]]; then
            echo 'Bộ kiểm thử không đạt hoặc chưa chạy xong. Xem kết quả trên LIBRA và log step Maven.'
            exit 1
          fi

      - name: Don database rieng cua lan chay
        if: ${{ always() && steps.database.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DB_NAME" =~ ^s4092_review_[a-f0-9]{32}$ ]]
          [[ "$DB_NAME" != "$PERMISSION_REVIEW_LIVE_DB" ]]
          export PGHOST=127.0.0.1 PGPORT=5433 PGUSER="$DB_USERNAME" PGPASSWORD="$DB_PASSWORD"
          psql -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE $DB_NAME WITH (FORCE);"
